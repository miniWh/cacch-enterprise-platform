# 开发环境配置（本地开发：内嵌容器启动，Flyway 开启并使用独立 schema enterprise，与共享库中台业务隔离）
spring:
  datasource:
    url: jdbc:postgresql://10.80.86.93:5432/cdb?currentSchema=enterprise
    username: esb
    password: esb
    driver-class-name: org.postgresql.Driver

  # ---------- Redis 配置 ----------
  data:
    redis:
      # 生产 Redis 地址通过环境变量 REDIS_HOST 注入
      host: 10.80.86.95
      # Redis 端口
      port: 6379
      # Redis 密码，必须由环境变量 REDIS_PASSWORD 注入（缺失即启动失败）
      password: cacredis0826
      lettuce:
        pool:
          # 最大活跃连接数（生产环境适当放大）
          max-active: 16
          # 最大空闲连接数（减少频繁创建/销毁开销）
          max-idle: 16
          # 最小空闲连接数（预创建 4 个，应对突发流量）
          min-idle: 4

  # Flyway：本地 dev 开启，独立 schema enterprise 隔离（与共享库中台业务的 public schema 迁移历史互不干扰）
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: enterprise
    default-schema: enterprise

# 应用自身配置
cacch:
  security:
    jwt-secret: your_jwt_secret_at_least_32_bytes   # 生产环境必须通过配置中心/外置配置注入，禁止硬编码真实密钥
    access-token-expire: 43200        # 访问令牌有效期（秒），12 小时
    refresh-token-expire: 43200       # 刷新令牌有效期（秒），12 小时（互踢策略下与访问令牌一致）
    login-channel-policy: KICK_OUT    # 多端登录策略：互踢
  cors:
    allowed-origins: http://127.0.0.1:5173,http://localhost:5173   # 浏览器 POST 请求必带 Origin 头，两种访问形式都须在白名单内
