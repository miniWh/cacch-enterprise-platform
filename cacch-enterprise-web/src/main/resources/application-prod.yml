# 生产环境配置（生产启动不得操作数据库结构；敏感配置建议通过 Tomcat setenv.sh 外置注入）
spring:
  datasource:
    url: jdbc:postgresql://10.80.86.93:5432/cdb?currentSchema=enterprise
    username: esb
    password: esb
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      # 生产 Redis 地址通过环境变量 REDIS_HOST 注入
      host: 10.80.86.95
      # Redis 端口
      port: 6379
      # Redis 密码，必须由环境变量 REDIS_PASSWORD 注入（缺失即启动失败）
      password: cacredis0826
      lettuce:
        pool:
          # 最大活跃连接数（生产环境适当放大）
          max-active: 16
          # 最大空闲连接数（减少频繁创建/销毁开销）
          max-idle: 16
          # 最小空闲连接数（预创建 4 个，应对突发流量）
          min-idle: 4

  # Flyway：prod 环境禁止自动迁移，prod 部署前须确认 test 已完成迁移
  flyway:
    enabled: false
    locations: classpath:db/migration

cacch:
  security:
    jwt-secret: CHANGE_ME_VIA_EXTERNAL_CONFIG       # 生产密钥必须通过 /opt/cacch/config/ 外置配置或配置中心覆盖
    access-token-expire: 43200
    refresh-token-expire: 43200
    login-channel-policy: KICK_OUT
  cors:
    allowed-origins: https://your-prod-domain
