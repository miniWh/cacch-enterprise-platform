# ============================================================
# 【模板 / 参考】外置生产配置，覆盖 War 包内同名文件
#
# 实际部署请勿手工拷贝本文件：由 deploy/04-config-prod.sh 在服务器上生成，
# 该脚本会随机生成 jwt-secret（openssl rand -hex 48）并设置 600 权限。
# 目标路径：/opt/cacch/config/application-prod.yml
# 由 setenv.sh 的 -Dspring.config.location=/opt/cacch/config/ 生效
#
# 说明：
#  - Flyway 保持 false：V1~V4 已在 10.80.86.93 执行完毕，prod 不操作表结构
#  - 重新生成 jwt-secret 会使所有已登录用户 token 失效
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://10.80.86.93:5432/cdb?currentSchema=enterprise
    username: esb
    password: esb
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: 10.80.86.95
      port: 6379
      password: cacredis0826
      lettuce:
        pool:
          max-active: 16
          max-idle: 16
          min-idle: 4

  # 排除 Spring Boot 默认安全用户自动配置（自研 JWT 过滤器，不依赖默认 UserDetailsService）
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  flyway:
    enabled: false
    locations: classpath:db/migration

cacch:
  security:
    # 部署前必须替换为真实随机密钥（至少 32 字节）
    jwt-secret: REPLACE_ME_openssl_rand_base64_48
    access-token-expire: 43200
    refresh-token-expire: 43200
    login-channel-policy: KICK_OUT
  cors:
    allowed-origins: http://10.80.62.200
