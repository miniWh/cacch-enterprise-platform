# ============================================================
# cacch-enterprise-platform Nginx 配置
# 放置路径：/etc/nginx/conf.d/cacch.conf
# 注意：后端 Controller 路径自带 /api 前缀，proxy_pass 末尾不得带 URI，
#       否则 /api 会被剥离导致 404。
# ============================================================
server {
    listen 80;
    server_name 10.80.62.200;

    root /opt/cacch/ui/dist;
    index index.html;

    client_max_body_size 20m;
    access_log /var/log/nginx/cacch-access.log;
    error_log  /var/log/nginx/cacch-error.log;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 客如云订单接口：必须放在 /api 之前以优先匹配
    location /api/v1/keruyun/ {
        proxy_pass http://10.80.68.10:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 本平台后端：原样转发，保留 /api 前缀
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
