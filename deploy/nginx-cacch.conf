# ============================================================
# cacch-enterprise-platform Nginx 配置
# 放置路径：/etc/nginx/conf.d/cacch.conf
# 注意：后端 Controller 路径自带 /api 前缀，proxy_pass 末尾不得带 URI，
#       否则 /api 会被剥离导致 404。
# ============================================================
server {
    listen 80;
    server_name 10.80.62.200;

    root /opt/cacch/ui/dist;
    index index.html;

    client_max_body_size 20m;
    access_log /var/log/nginx/cacch-access.log;
    error_log  /var/log/nginx/cacch-error.log;

    # ---- 缓存策略（2026-11-02 修订）----
    # 背景：此前 index.html 未下发任何 Cache-Control，浏览器按启发式策略长期缓存它，
    # 发版后仍请求旧 hash 的 js → 该文件已删除 → 404 → 前端 JS 加载失败 → 页面卡死、
    # API 请求根本发不出（表现为"后端无日志"）。清缓存/换浏览器即恢复，正是此症状。
    #
    # 入口 HTML 永不缓存：保证每次访问都拿到最新的资源 hash 引用
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 带 hash 的构建产物可放心长缓存。
    # 必须用 ^~ ：普通前缀匹配的优先级低于正则，不加 ^~ 会被下面的
    # location ~* \.(js|css|...)$ 抢走，导致本段完全不生效。
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 无 hash 的其他静态资源（favicon 等）：短缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 客如云订单接口：必须放在 /api 之前以优先匹配
    location /api/v1/keruyun/ {
        proxy_pass http://10.80.68.10:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 本平台后端：原样转发，保留 /api 前缀
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
